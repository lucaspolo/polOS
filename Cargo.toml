[package]
name = "pol_os"
version = "0.1.0"
authors = ["Lucas Polo <pradopolo@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bootloader = { version = "0.9.35", features = ["map_physical_memory"] }
volatile = "0.6.1"
spin = "0.12.3"
x86_64 = "0.15.5"
uart_16550 = "0.8.0"
pic8259 = "0.11.0"
pc-keyboard = "0.9.0"
linked_list_allocator = "0.10.6"

[dependencies.conquer-once]
version = "0.4.0"
default-features = false

[dependencies.crossbeam-queue]
version = "0.3.13"
default-features = false
features = ["alloc"]

[dependencies.futures-util]
version = "0.3.34"
default-features = false
features = ["alloc"]

[package.metadata.bootimage]
test-args = [
	"-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio",
	"-display", "none"
]
test-success-exit-code = 33

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false
